# KisanMitra AI — Dart Analysis Options
# Configures the static analyzer for Flutter.

analyzer:
  errors:
    # Treat these as warnings, not errors (to avoid CI breakage on minor issues)
    unused_import: warning
    unused_local_variable: warning
    dead_code: warning

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - unnecessary_this
    - unnecessary_new
    - prefer_is_empty
    - prefer_is_not_empty
