# ==============================================================================
# KisanMitra AI — Development Docker Compose
# ==============================================================================
# Usage:
#   cp backend/.env.example backend/.env  # Fill in your API keys
#   docker-compose up --build
# ==============================================================================

version: "3.9"

services:
  # ---- Backend API ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kisanmitra-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DBNAME=kisanmitra
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - DEBUG=true
    volumes:
      - ./backend/models:/app/models:ro  # Mount model weights (read-only)
      - ./backend/commodity_mappings.csv:/app/commodity_mappings.csv:ro
      - ./backend/up_districts.csv:/app/up_districts.csv:ro
      - ./backend/firebase-sa.json:/app/firebase-sa.json:ro  # Firebase service account
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - kisanmitra-net

  # ---- MongoDB ----
  mongo:
    image: mongo:7.0
    container_name: kisanmitra-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kisanmitra-net

  # ---- Redis (Caching) ----
  redis:
    image: redis:7-alpine
    container_name: kisanmitra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - kisanmitra-net

volumes:
  mongo-data:
  redis-data:

networks:
  kisanmitra-net:
    driver: bridge
